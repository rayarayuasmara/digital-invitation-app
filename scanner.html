<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Scanner Check-in - RayaRayu</title>
  <!-- Tailwind CSS & Google Fonts -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- Supabase & HTML5 QR Scanner Library -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    
    @keyframes scan-laser {
      0% { top: 5%; opacity: 0.3; }
      50% { opacity: 1; }
      100% { top: 90%; opacity: 0.3; }
    }
    .animate-laser { animation: scan-laser 2s infinite ease-in-out; }

    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    #reader video {
      object-fit: cover !important;
      width: 100% !important;
      height: 100% !important;
      border-radius: 1.5rem;
    }
    #reader__scan_region { background: transparent !important; }
    #reader__dashboard { display: none !important; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 antialiased flex justify-center min-h-screen">

  <div class="w-full max-w-md bg-slate-900 min-h-screen flex flex-col justify-between relative overflow-hidden shadow-2xl border-x border-slate-800">

    <!-- TOP HEADER BAR -->
    <header class="p-4 flex items-center justify-between z-20 backdrop-blur-md bg-slate-900/80 sticky top-0 border-b border-slate-800/60">
      <div class="flex items-center gap-3">
        <div class="w-9 h-9 bg-emerald-500/10 border border-emerald-500/30 rounded-xl flex items-center justify-center text-emerald-400 font-extrabold text-sm shadow-inner">
          ❖
        </div>
        <div>
          <h1 class="text-sm font-extrabold text-white tracking-tight">RayaRayu Scanner</h1>
          <p class="text-[10px] text-slate-400 font-medium flex items-center gap-1">
            <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span> Mode Operator Door
          </p>
        </div>
      </div>
      
      <!-- Action Buttons Header -->
      <div class="flex items-center gap-2">
        <button onclick="toggleTorch()" id="btn-torch" class="w-9 h-9 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-xl flex items-center justify-center text-sm border border-slate-700 transition" title="Lampu Senter">
          🔦
        </button>
        <button onclick="logout()" class="w-9 h-9 bg-rose-500/10 hover:bg-rose-500/20 text-rose-400 rounded-xl flex items-center justify-center text-sm border border-rose-500/30 transition font-bold" title="Keluar">
          🚪
        </button>
      </div>
    </header>

    <!-- MAIN CAMERA / SCANNER AREA -->
    <main class="flex-1 flex flex-col items-center justify-center p-6 relative">
      
      <!-- Instructional Tag -->
      <div class="text-center space-y-1 mb-6 z-10">
        <span class="bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 text-[10px] font-bold px-3.5 py-1 rounded-full uppercase tracking-wider">
          Arahkan Kamera ke QR Tiket
        </span>
      </div>

      <!-- CAMERA CONTAINER -->
      <div class="relative w-72 h-72 rounded-3xl overflow-hidden border-2 border-slate-700 bg-slate-950 shadow-2xl flex items-center justify-center">
        
        <!-- Video Stream Container -->
        <div id="reader" class="w-full h-full"></div>

        <!-- Viewfinder Corners -->
        <div class="absolute inset-0 pointer-events-none p-4 flex flex-col justify-between z-10">
          <div class="flex justify-between">
            <div class="w-8 h-8 border-t-4 border-l-4 border-emerald-400 rounded-tl-2xl"></div>
            <div class="w-8 h-8 border-t-4 border-r-4 border-emerald-400 rounded-tr-2xl"></div>
          </div>
          <div class="flex justify-between">
            <div class="w-8 h-8 border-b-4 border-l-4 border-emerald-400 rounded-bl-2xl"></div>
            <div class="w-8 h-8 border-b-4 border-r-4 border-emerald-400 rounded-br-2xl"></div>
          </div>
        </div>

        <!-- Laser Line Animation -->
        <div id="laser-line" class="absolute left-4 right-4 h-0.5 bg-gradient-to-r from-transparent via-emerald-400 to-transparent shadow-[0_0_15px_#34d399] z-10 animate-laser"></div>

      </div>

      <!-- Quick Manual Input Option -->
      <div class="mt-8 text-center z-10 space-y-2">
        <button onclick="openManualModal()" class="text-xs font-bold text-slate-400 hover:text-emerald-400 transition underline underline-offset-4 flex items-center gap-1.5 mx-auto">
          <span>🔍</span> Cari & Masukkan Tamu Manual
        </button>
        <p id="guest-count-badge" class="text-[11px] text-slate-500">Memuat status tamu...</p>
      </div>

    </main>

    <!-- FOOTER STATUS BAR -->
    <footer class="p-4 text-center text-xs text-slate-500 border-t border-slate-800/60 bg-slate-900/50 backdrop-blur-md">
      <p>© 2026 RayaRayu Check-in System</p>
    </footer>

    <!-- MODAL MANUAL CHECK-IN & DAFTAR NAMA TAMU -->
    <div id="manual-modal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-md z-50 flex items-end justify-center p-4 transition-all duration-300 transform translate-y-full opacity-0 pointer-events-none">
      <div class="w-full max-w-sm bg-slate-900 border border-slate-800 rounded-3xl p-5 space-y-4 shadow-2xl relative">
        
        <div class="flex justify-between items-center border-b border-slate-800 pb-3">
          <h3 class="text-sm font-extrabold text-white">Check-in Manual Tamu</h3>
          <button onclick="closeManualModal()" class="w-7 h-7 rounded-full bg-slate-800 text-slate-400 text-xs font-bold flex items-center justify-center">✕</button>
        </div>

        <!-- Search Bar -->
        <div class="relative">
          <input type="text" id="manual-search-input" onkeyup="filterManualGuests()" placeholder="Ketik nama tamu..." class="w-full text-xs p-3 pl-9 rounded-2xl bg-slate-950 border border-slate-800 text-white placeholder-slate-500 focus:outline-none focus:border-emerald-500" />
          <span class="absolute left-3 top-3 text-slate-500 text-xs">🔍</span>
        </div>

        <!-- Daftar Tamu Dropdown List -->
        <div id="manual-guest-list" class="max-h-56 overflow-y-auto no-scrollbar space-y-2 pr-1">
          <p class="text-xs text-slate-500 text-center py-4">Memuat daftar tamu...</p>
        </div>

        <!-- Manual Token Input Direct -->
        <div class="pt-2 border-t border-slate-800/80">
          <p class="text-[10px] text-slate-500 mb-1.5 font-semibold uppercase tracking-wider">Atau Masukkan Kode Token Tiket:</p>
          <div class="flex gap-2">
            <input type="text" id="manual-token-input" placeholder="Contoh: 115b0522 / f4d30e93" class="flex-1 text-xs p-3 rounded-xl bg-slate-950 border border-slate-800 text-white placeholder-slate-600 outline-none uppercase font-mono" />
            <button onclick="submitManualTokenInput()" class="bg-emerald-500 hover:bg-emerald-400 text-slate-950 text-xs font-extrabold px-4 rounded-xl shadow-md transition">
              Proses
            </button>
          </div>
        </div>

      </div>
    </div>

    <!-- RESULT MODAL SLIDE-UP -->
    <div id="result-modal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-md z-50 flex items-end justify-center p-4 transition-all duration-300 transform translate-y-full opacity-0 pointer-events-none">
      <div class="w-full max-w-sm bg-slate-900 border border-slate-800 rounded-3xl p-6 space-y-5 shadow-2xl relative overflow-hidden">
        
        <div id="modal-glow" class="absolute -top-12 left-1/2 -translate-x-1/2 w-40 h-20 bg-emerald-500/20 blur-2xl rounded-full pointer-events-none"></div>

        <div class="text-center">
          <div id="modal-icon-bg" class="w-16 h-16 rounded-2xl mx-auto flex items-center justify-center text-3xl mb-3 border">
            <span id="modal-icon">✅</span>
          </div>
          <h3 id="modal-title" class="text-lg font-extrabold text-white tracking-tight">Berhasil Check-in</h3>
          <p id="modal-subtitle" class="text-xs text-slate-400 mt-1">Tamu siap dipersilakan masuk</p>
        </div>

        <div id="modal-details" class="bg-slate-950/60 p-4 rounded-2xl border border-slate-800/80 space-y-2 text-xs">
          <div class="flex justify-between items-center border-b border-slate-800/60 pb-2">
            <span class="text-slate-400">Nama Tamu</span>
            <strong id="res-guest-name" class="text-white text-sm font-bold">-</strong>
          </div>
          <div class="flex justify-between items-center border-b border-slate-800/60 pb-2">
            <span class="text-slate-400">Kategori</span>
            <span id="res-category" class="bg-slate-800 text-slate-200 px-2.5 py-0.5 rounded-full text-[10px] font-bold">Umum</span>
          </div>
          <div class="flex justify-between items-center">
            <span class="text-slate-400">Jumlah Pax</span>
            <span id="res-pax" class="text-emerald-400 font-extrabold text-sm">-</span>
          </div>
        </div>

        <button onclick="resumeScanner()" class="w-full bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-extrabold text-xs py-3.5 rounded-2xl shadow-lg shadow-emerald-500/20 transition">
          Pindai Tiket Berikutnya ➔
        </button>

      </div>
    </div>

  </div>

<script>
  // ==========================================
  // KONFIGURASI SUPABASE
  // ==========================================
  const SUPABASE_URL = "https://awwraxmftlbekclwdrix.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_FirHDmsq1aDzQTPhQfyXjQ_x2f97MsJ";
  const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  let html5QrcodeScanner = null;
  let isProcessing = false;
  let allRegisteredGuests = [];

  function cleanTokenString(str) {
    if (!str) return '';
    return String(str)
      .trim()
      .toLowerCase()
      .replace(/[\u200B-\u200D\uFEFF]/g, '')
      .replace(/[\u2010-\u2015\u2212]/g, '-');
  }

  async function startScanner() {
    html5QrcodeScanner = new Html5Qrcode("reader");

    const config = { 
      fps: 10,
      qrbox: { width: 220, height: 220 }
    };

    try {
      await html5QrcodeScanner.start(
        { facingMode: "environment" }, 
        config, 
        onScanSuccess
      );
    } catch (err) {
      console.warn("Mencoba kamera alternatif...", err);
      try {
        await html5QrcodeScanner.start({ facingMode: "user" }, config, onScanSuccess);
      } catch (errUser) {
        console.info("Kamera tidak aktif. Mode pencarian manual siap digunakan.");
      }
    }

    // Ambil daftar tamu untuk pencarian manual
    fetchRegisteredGuests();
  }

  // FIX BUG: Jangan query ticket_token atau is_checked_in dari tabel guests!
  async function fetchRegisteredGuests() {
    // 1. Coba panggil RPC get_scanner_guests
    const { data: rpcData, error: rpcError } = await supabaseClient.rpc('get_scanner_guests');

    if (!rpcError && rpcData && Array.isArray(rpcData)) {
      allRegisteredGuests = rpcData;
      updateGuestCountBadge();
      renderManualGuestList(allRegisteredGuests);
      return;
    }

    // 2. Fallback query join yang valid
    try {
      const [guestsRes, ticketsRes, rsvpsRes] = await Promise.all([
        supabaseClient.from('guests').select('id, group_name, category, max_pax, invitation_token').order('group_name', { ascending: true }),
        supabaseClient.from('tickets').select('guest_id, ticket_token, is_checked_in'),
        supabaseClient.from('rsvps').select('guest_id, status, pax_confirmed')
      ]);

      if (guestsRes.data) {
        const ticketMap = new Map();
        (ticketsRes.data || []).forEach(t => ticketMap.set(t.guest_id, t));

        const rsvpMap = new Map();
        (rsvpsRes.data || []).forEach(r => rsvpMap.set(r.guest_id, r));

        allRegisteredGuests = guestsRes.data.map(g => {
          const t = ticketMap.get(g.id);
          const r = rsvpMap.get(g.id);
          return {
            id: g.id,
            group_name: g.group_name,
            category: g.category || 'Umum',
            max_pax: g.max_pax || 2,
            invitation_token: g.invitation_token,
            ticket_token: t?.ticket_token || g.invitation_token,
            is_checked_in: !!t?.is_checked_in,
            pax_confirmed: r?.pax_confirmed || g.max_pax,
            rsvp_status: r?.status || 'pending'
          };
        });

        updateGuestCountBadge();
        renderManualGuestList(allRegisteredGuests);
      }
    } catch (err) {
      console.error("Gagal memuat daftar tamu:", err);
      document.getElementById('manual-guest-list').innerHTML = '<p class="text-xs text-rose-400 text-center py-4">Gagal memuat data tamu dari database.</p>';
    }
  }

  function updateGuestCountBadge() {
    const total = allRegisteredGuests.length;
    const checked = allRegisteredGuests.filter(g => g.is_checked_in).length;
    const badge = document.getElementById('guest-count-badge');
    if (badge) {
      badge.textContent = `${checked} dari ${total} tamu telah check-in`;
    }
  }

  function renderManualGuestList(guests) {
    const container = document.getElementById('manual-guest-list');
    container.innerHTML = '';

    if (!guests || guests.length === 0) {
      container.innerHTML = '<p class="text-xs text-slate-500 text-center py-4">Tamu tidak ditemukan.</p>';
      return;
    }

    guests.forEach(g => {
      const activeToken = g.invitation_token || g.ticket_token;
      const statusBadge = g.is_checked_in 
        ? '<span class="text-[9px] bg-blue-500/20 text-blue-400 font-bold px-2 py-0.5 rounded-full border border-blue-500/30">Checked</span>'
        : '<span class="text-[9px] bg-emerald-500/20 text-emerald-400 font-bold px-2 py-0.5 rounded-full border border-emerald-500/30">Ready</span>';

      const div = document.createElement('div');
      div.className = "bg-slate-950 p-3 rounded-xl border border-slate-800/80 flex items-center justify-between hover:border-emerald-500/50 transition cursor-pointer";
      div.onclick = () => selectManualGuest(activeToken);
      div.innerHTML = `
        <div class="min-w-0 pr-2">
          <p class="text-xs font-bold text-white truncate">${g.group_name}</p>
          <p class="text-[10px] text-slate-400 mt-0.5 truncate">${g.category || 'Umum'} • Kode: <span class="font-mono text-emerald-300 font-bold">${activeToken}</span></p>
        </div>
        <div>${statusBadge}</div>
      `;
      container.appendChild(div);
    });
  }

  function filterManualGuests() {
    const search = document.getElementById('manual-search-input').value.toLowerCase();
    const filtered = allRegisteredGuests.filter(g => 
      g.group_name.toLowerCase().includes(search) || 
      (g.invitation_token && g.invitation_token.toLowerCase().includes(search)) ||
      (g.ticket_token && g.ticket_token.toLowerCase().includes(search))
    );
    renderManualGuestList(filtered);
  }

  function openManualModal() {
    closeResultModal();
    fetchRegisteredGuests();
    const modal = document.getElementById('manual-modal');
    modal.classList.remove('translate-y-full', 'opacity-0', 'pointer-events-none');
    setTimeout(() => document.getElementById('manual-search-input')?.focus(), 200);
  }

  function closeManualModal() {
    const modal = document.getElementById('manual-modal');
    modal.classList.add('translate-y-full', 'opacity-0', 'pointer-events-none');
  }

  function selectManualGuest(token) {
    closeManualModal();
    if (token) {
      processCheckIn(token);
    }
  }

  function submitManualTokenInput() {
    const token = cleanTokenString(document.getElementById('manual-token-input').value);
    if (!token) return alert("Masukkan kode token terlebih dahulu.");
    closeManualModal();
    processCheckIn(token);
  }

  // Handle saat QR Code terbaca kamera
  async function onScanSuccess(decodedText) {
    if (isProcessing) return;

    let rawText = String(decodedText).trim();
    if (!rawText || rawText === "undefined") return;

    isProcessing = true;
    if (navigator.vibrate) navigator.vibrate(100);

    // Ekstrak token jika QR berupa URL link
    let extractedToken = rawText;
    if (rawText.includes('?token=')) {
      extractedToken = rawText.split('?token=')[1].split('&')[0];
    } else if (rawText.includes('/')) {
      const parts = rawText.split('?')[0].split('/').filter(Boolean);
      extractedToken = parts[parts.length - 1];
    }

    extractedToken = cleanTokenString(extractedToken);
    await processCheckIn(extractedToken);
  }

  // Proses Check-in Hybrid (Mendukung Token Pendek maupun UUID)
  async function processCheckIn(ticketToken) {
    const tokenClean = cleanTokenString(ticketToken);

    // 1. Coba RPC check_in_guest
    const { data, error } = await supabaseClient.rpc('check_in_guest', { p_ticket_token: tokenClean });

    if (error) {
      console.warn("RPC Error, beralih ke fallback check-in:", error);
      return await fallbackDirectCheckIn(tokenClean);
    }

    if (!data.success) {
      showModal(false, "Peringatan Tiket", `${data.message}\n(Kode terbaca: "${tokenClean}")`, data.guest || null);
    } else {
      showModal(true, "Berhasil Check-in!", "Tamu terverifikasi resmi.", data.guest);
      fetchRegisteredGuests();
    }
  }

  // Fallback direct check-in jika Stored Procedure SQL di database belum diupdate
  async function fallbackDirectCheckIn(tokenClean) {
    try {
      const { data: guests } = await supabaseClient
        .from('guests')
        .select('id, group_name, category, max_pax, invitation_token')
        .ilike('invitation_token', tokenClean)
        .limit(1);

      if (!guests || guests.length === 0) {
        showModal(false, "Tiket Tidak Ditemukan", `Kode token "${tokenClean}" tidak terdaftar di daftar undangan.`, null);
        return;
      }

      const g = guests[0];
      const { data: tickets } = await supabaseClient
        .from('tickets')
        .select('*')
        .eq('guest_id', g.id)
        .limit(1);

      if (tickets && tickets.length > 0 && tickets[0].is_checked_in) {
        showModal(false, "Sudah Pernah Check-in", `Tamu "${g.group_name}" sudah diverifikasi sebelumnya.`, {
          group_name: g.group_name,
          category: g.category,
          max_pax: g.max_pax
        });
        return;
      }

      if (tickets && tickets.length > 0) {
        await supabaseClient.from('tickets').update({ is_checked_in: true, checked_in_at: new Date().toISOString() }).eq('id', tickets[0].id);
      } else {
        await supabaseClient.from('tickets').insert({ guest_id: g.id, ticket_token: g.invitation_token, is_checked_in: true, checked_in_at: new Date().toISOString() });
      }

      showModal(true, "Berhasil Check-in!", "Tamu terverifikasi resmi (Direct Mode).", {
        group_name: g.group_name,
        category: g.category,
        pax_confirmed: g.max_pax
      });
      fetchRegisteredGuests();
    } catch (err) {
      showModal(false, "Kesalahan Check-in", err.message || "Gagal memproses tiket.", null);
    }
  }

  function showModal(isSuccess, title, subtitle, guest) {
    const modal = document.getElementById('result-modal');
    const glow = document.getElementById('modal-glow');
    const iconBg = document.getElementById('modal-icon-bg');
    const icon = document.getElementById('modal-icon');

    document.getElementById('modal-title').innerText = title;
    document.getElementById('modal-subtitle').innerText = subtitle;

    if (isSuccess) {
      glow.className = "absolute -top-12 left-1/2 -translate-x-1/2 w-40 h-20 bg-emerald-500/30 blur-2xl rounded-full pointer-events-none";
      iconBg.className = "w-16 h-16 rounded-2xl mx-auto flex items-center justify-center text-3xl mb-3 border bg-emerald-500/10 border-emerald-500/30 text-emerald-400";
      icon.innerText = "✅";
    } else {
      glow.className = "absolute -top-12 left-1/2 -translate-x-1/2 w-40 h-20 bg-rose-500/30 blur-2xl rounded-full pointer-events-none";
      iconBg.className = "w-16 h-16 rounded-2xl mx-auto flex items-center justify-center text-3xl mb-3 border bg-rose-500/10 border-rose-500/30 text-rose-400";
      icon.innerText = "⚠️";
    }

    if (guest) {
      document.getElementById('modal-details').classList.remove('hidden');
      document.getElementById('res-guest-name').innerText = guest.group_name || "-";
      document.getElementById('res-category').innerText = guest.category || "Umum";
      document.getElementById('res-pax').innerText = `${guest.pax_confirmed || guest.max_pax || 1} Orang`;
    } else {
      document.getElementById('modal-details').classList.add('hidden');
    }

    modal.classList.remove('translate-y-full', 'opacity-0', 'pointer-events-none');
  }

  function closeResultModal() {
    const modal = document.getElementById('result-modal');
    modal.classList.add('translate-y-full', 'opacity-0', 'pointer-events-none');
  }

  function resumeScanner() {
    closeResultModal();
    setTimeout(() => {
      isProcessing = false;
    }, 500);
  }

  async function toggleTorch() {
    try {
      const track = html5QrcodeScanner.getRunningTrack();
      if (track && track.getCapabilities().torch) {
        const torchState = track.getSettings().torch;
        await track.applyConstraints({
          advanced: [{ torch: !torchState }]
        });
      } else {
        alert("Senter tidak didukung pada kamera perangkat ini.");
      }
    } catch (e) {
      alert("Fitur senter tidak dapat diaktifkan.");
    }
  }

  async function logout() {
    if (confirm("Keluar dari mode scanner?")) {
      await supabaseClient.auth.signOut();
      window.location.href = "/";
    }
  }

  window.addEventListener('DOMContentLoaded', startScanner);
</script>

</body>
</html>
