<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#f4f5f8" id="meta-theme" />
<title>Scanner Check-in - RayaRayu</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@500;600&family=Geist:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
:root{
  --bg:#f4f5f8; --card:#ffffff; --ink:#0d1424; --sub:#6b7385; --line:#e6e8ef;
  --brand:#0a3dc2; --soft:#e8edfb; --green:#12b76a; --green-bg:#dcf7ea; --green-ink:#0b8a57;
  --red-bg:#fde4e5; --red-ink:#c62d33; --amber-bg:#fdf0d5; --amber-ink:#a86a00; --blue-bg:#dbe5ff; --tag:#eef0f5; --tag-ink:#4a5263;
  --shadow:0 1px 2px rgba(12,24,60,.05), 0 8px 24px rgba(12,24,60,.04);
}
:root[data-dark="1"]{
  --bg:#0b0f1a; --card:#151b2b; --ink:#f2f5ff; --sub:#97a0b5; --line:#242c40; --soft:#1d2a4f; --brand:#6d8bff;
  --green-bg:#0f3a2a; --green-ink:#4ade9a; --red-bg:#3d1d22; --red-ink:#ff8b90; --amber-bg:#3d300f; --amber-ink:#ffc865; --blue-bg:#1b2a57; --tag:#222a3f; --tag-ink:#c3cadb;
  --shadow:none;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Geist',Inter,-apple-system,system-ui,sans-serif;-webkit-font-smoothing:antialiased;display:flex;justify-content:center}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer;text-align:left}
input{background:transparent}
.hidden{display:none!important}
#app{width:100%;max-width:480px;min-height:100vh;position:relative;display:flex;flex-direction:column;justify-content:space-between}
svg.lucide{width:1.15em;height:1.15em;stroke-width:1.8}
.display{font-family:'Geist',sans-serif;font-weight:800;letter-spacing:-.02em}
.num{font-family:'Geist Mono',monospace;font-weight:600;letter-spacing:-.01em}

input, select, textarea { font-size: 16px !important; }

.smooth-scroll {
  overflow-x: auto;
  overflow-y: hidden;
  white-space: nowrap;
  scroll-behavior: smooth;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
}
.smooth-scroll::-webkit-scrollbar { display: none; }

/* Header */
.topbar{display:flex;justify-content:space-between;align-items:center;padding:calc(env(safe-area-inset-top) + 22px) 20px 16px;background:var(--card);border-bottom:1px solid var(--line)}
.topbar h1{margin:0;font-size:22px;color:var(--brand);font-family:'Geist',sans-serif;font-weight:800}
.logo{width:40px;height:40px;border-radius:12px;background:var(--brand);color:#fff;display:grid;place-items:center;font-family:'Geist',sans-serif;font-weight:800;font-size:19px}

/* Avatar */
.av {
  width: 44px !important;
  height: 44px !important;
  min-width: 44px !important;
  max-width: 44px !important;
  min-height: 44px !important;
  max-height: 44px !important;
  border-radius: 50% !important;
  background: var(--soft);
  color: var(--brand);
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 600;
  font-size: 14px;
  position: relative;
  flex-shrink: 0;
  overflow: hidden;
  font-family: 'Geist Mono', monospace;
}

/* Tombol Ikon Bundar Tipis */
.ib{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;color:var(--sub);background:var(--card);transition:all .15s}
.ib:hover{border-color:var(--brand);color:var(--brand)}
.ib.active{background:var(--soft);color:var(--brand);border-color:var(--brand)}

/* Main Content Area */
.page{padding:20px 16px calc(20px + env(safe-area-inset-bottom));flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center}

@keyframes scan-laser {
  0% { top: 5%; opacity: 0.3; }
  50% { opacity: 1; }
  100% { top: 90%; opacity: 0.3; }
}
.animate-laser { animation: scan-laser 2s infinite ease-in-out; }

#reader {
  border-radius: 24px;
  overflow: hidden;
  border: 2px solid var(--line);
  background: var(--card);
  width: 100%;
  height: 100%;
}
#reader video {
  border-radius: 22px;
  object-fit: cover !important;
  width: 100% !important;
  height: 100% !important;
}

/* Sbar */
.sbar{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:18px;height:54px;padding:0 6px 0 16px;box-shadow:var(--shadow);border:1px solid var(--line)}
.sbar>svg{color:var(--sub);width:20px;height:20px;flex-shrink:0}
.sbar input{flex:1;min-width:0;border:0;outline:none;font-size:16px;color:var(--ink)}
.sbar input::placeholder{color:var(--sub)}

.listcard{background:var(--card);border-radius:24px;padding:4px 18px 8px;box-shadow:var(--shadow)}

/* Sheet & Modal Popups (Gaya Dash) */
.backdrop{position:fixed;inset:0;background:rgba(9,16,40,.4);z-index:50;opacity:0;pointer-events:none;transition:opacity .35s cubic-bezier(.32,.72,0,1)}
.backdrop.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:50%;bottom:0;width:100%;max-width:480px;z-index:51;background:var(--bg);border-radius:32px 32px 0 0;padding:10px 16px calc(24px + env(safe-area-inset-bottom));max-height:88vh;overflow-y:auto;transform:translate(-50%,105%);transition:transform .5s cubic-bezier(.32,.72,0,1);box-shadow:0 -20px 60px rgba(9,16,40,.25)}
.sheet.open{transform:translate(-50%,0)}
.grab{width:40px;height:5px;border-radius:99px;background:var(--line);margin:0 auto 14px}
.sheet-head{display:flex;justify-content:space-between;align-items:center;margin:0 4px 14px}
.sheet-head h3{margin:0;font-family:'Geist',sans-serif;font-weight:800;font-size:20px}
.sheet-head button{color:var(--brand);font-weight:600;font-size:15px;padding:6px}

/* List Item Tamu di Manual Check-in */
.gl{display:flex;align-items:center;gap:12px;padding:12px 0;width:100%;text-align:left}
.gl+.gl{border-top:1px solid var(--line)}
.gl .main{flex:1;min-width:0;display:flex;gap:12px;align-items:center}
.gl .n{font-weight:600;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink)}
.st{font-size:12px;padding:4px 12px;border-radius:999px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.st::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.st.st-hadir{background:var(--green-bg);color:var(--green-ink)}
.st.st-checked{background:var(--blue-bg);color:var(--brand)}

.btn{width:100%;height:54px;border-radius:18px;background:var(--brand);color:#fff;font-weight:600;font-size:17px;display:flex;align-items:center;justify-content:center;gap:8px;transition:transform .15s,opacity .2s}
.btn:active{transform:scale(.98)}

/* Card Switch / Tabs */
.card-switch {
  display: flex;
  background: var(--soft);
  border-radius: 999px;
  padding: 4px;
  width: 100%;
}
.card-switch button {
  flex: 1;
  background: transparent;
  border: 0;
  color: var(--sub);
  font-size: 14px;
  font-weight: 600;
  padding: 8px 12px;
  border-radius: 999px;
  cursor: pointer;
  transition: all .2s;
  text-align: center;
}
.card-switch button.active {
  background: var(--card);
  color: var(--brand);
  box-shadow: 0 2px 8px rgba(0,0,0,.08);
}

/* Toast */
.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top));transform:translate(-50%,-160%);z-index:80;background:var(--card);color:var(--ink);padding:12px 18px;border-radius:999px;font-size:14px;font-weight:500;display:flex;gap:8px;align-items:center;transition:transform .5s cubic-bezier(.34,1.56,.64,1);max-width:92%;box-shadow:0 10px 30px rgba(0,0,0,.15);border:1px solid var(--line)}
.toast svg{width:16px;height:16px;color:var(--green)}
.toast.show{transform:translate(-50%,0)}
</style>
</head>
<body>
<div id="app">

  <!-- TOP HEADER BAR -->
  <header class="topbar">
    <div class="flex items-center gap-3">
      <div class="logo">R</div>
      <div>
        <h1>Scanner Door</h1>
        <p class="text-xs text-[var(--sub)] font-medium flex items-center gap-1.5 mt-0.5">
          <span class="w-2 h-2 rounded-full bg-[var(--green)] animate-pulse"></span> Operator Aktif
        </p>
      </div>
    </div>
    
    <!-- Action Buttons Header -->
    <div class="flex items-center gap-2">
      <button onclick="toggleTorch()" id="btn-torch" class="ib" title="Lampu Senter">
        <i data-lucide="flashlight"></i>
      </button>
      <button onclick="logout()" class="ib" title="Keluar" style="color:var(--red-ink);border-color:var(--red-bg);background:var(--red-bg)">
        <i data-lucide="log-out"></i>
      </button>
    </div>
  </header>

  <!-- MAIN CAMERA / SCANNER AREA -->
  <main class="page">
    
    <!-- Instructional Tag -->
    <div class="text-center mb-5 z-10">
      <span class="bg-[var(--soft)] text-[var(--brand)] text-xs font-semibold px-4 py-1.5 rounded-full">
        Arahkan kamera ke QR Code undangan tamu
      </span>
    </div>

    <!-- CAMERA CONTAINER -->
    <div class="relative w-72 h-72 sm:w-80 sm:h-80 rounded-[28px] overflow-hidden border border-[var(--line)] bg-[var(--card)] shadow-lg flex items-center justify-center">
      
      <!-- Video Stream Container -->
      <div id="reader" class="w-full h-full"></div>

      <!-- Viewfinder Corners -->
      <div class="absolute inset-0 pointer-events-none p-4 flex flex-col justify-between z-10">
        <div class="flex justify-between">
          <div class="w-8 h-8 border-t-4 border-l-4 border-[var(--brand)] rounded-tl-xl"></div>
          <div class="w-8 h-8 border-t-4 border-r-4 border-[var(--brand)] rounded-tr-xl"></div>
        </div>
        <div class="flex justify-between">
          <div class="w-8 h-8 border-b-4 border-l-4 border-[var(--brand)] rounded-bl-xl"></div>
          <div class="w-8 h-8 border-b-4 border-r-4 border-[var(--brand)] rounded-br-xl"></div>
        </div>
      </div>

      <!-- Laser Line Animation -->
      <div id="laser-line" class="absolute left-4 right-4 h-0.5 bg-gradient-to-r from-transparent via-[var(--brand)] to-transparent shadow-[0_0_12px_var(--brand)] z-10 animate-laser"></div>

    </div>

    <!-- Quick Manual Input Option -->
    <div class="mt-6 text-center z-10 space-y-2">
      <button onclick="openManualModal()" class="text-xs font-semibold text-[var(--brand)] hover:underline flex items-center gap-1.5 mx-auto bg-[var(--soft)] px-4 py-2.5 rounded-full transition">
        <i data-lucide="search" style="width:14px;height:14px;"></i> Cari & Masukkan Tamu Manual
      </button>
      <p id="guest-count-badge" class="text-xs text-[var(--sub)] font-mono">Memuat status tamu...</p>
    </div>

  </main>

  <!-- FOOTER STATUS BAR -->
  <footer class="p-4 text-center text-xs text-[var(--sub)] border-t border-[var(--line)] bg-[var(--card)]">
    <p>© 2026 RayaRayu Check-in System</p>
  </footer>

  <!-- BACKDROP & MODAL MANUAL / HASIL -->
  <div class="backdrop" id="backdrop" onclick="closeAllModals()"></div>

  <!-- SHEET / MODAL MANUAL CHECK-IN -->
  <div class="sheet" id="manual-modal" role="dialog" aria-modal="true">
    <div class="grab"></div>
    <div class="sheet-head">
      <h3>Check-in Manual Tamu</h3>
      <button onclick="closeManualModal()">Tutup</button>
    </div>

    <div class="space-y-3">
      <!-- Search Bar -->
      <div class="sbar">
        <i data-lucide="search"></i>
        <input type="search" id="manual-search-input" oninput="filterManualGuests()" placeholder="Ketik nama tamu..." />
      </div>

      <!-- Daftar Tamu Dropdown List -->
      <div class="listcard" style="max-height: 220px; overflow-y: auto; padding: 0 12px;" id="manual-guest-list">
        <div class="text-xs text-[var(--sub)] text-center py-6">Memuat daftar tamu...</div>
      </div>

      <!-- Manual Token Input Direct -->
      <div class="pt-2">
        <p class="text-xs text-[var(--sub)] mb-1 font-semibold">Atau Masukkan Kode Token Tiket:</p>
        <div class="flex gap-2">
          <input type="text" id="manual-token-input" placeholder="Contoh: token123" class="sbar flex-1 uppercase font-mono" style="height:48px; padding:0 14px;" />
          <button onclick="submitManualTokenInput()" class="btn" style="width:110px; height:48px; font-size:14px; border-radius:18px;">Proses</button>
        </div>
      </div>
    </div>
  </div>

  <!-- SHEET / MODAL RESULT CHECK-IN -->
  <div class="sheet" id="result-modal" role="dialog" aria-modal="true">
    <div class="grab"></div>
    <div class="sheet-head">
      <h3 id="modal-title">Berhasil Check-in</h3>
      <button onclick="resumeScanner()">Selesai</button>
    </div>

    <div class="listcard" style="padding: 16px 20px; text-align: center;">
      <div id="modal-icon-bg" class="w-16 h-16 rounded-full mx-auto flex items-center justify-center text-3xl mb-3 bg-[var(--green-bg)] text-[var(--green-ink)]">
        <span id="modal-icon">✅</span>
      </div>
      <p id="modal-subtitle" class="text-xs text-[var(--sub)] mb-4">Tamu siap dipersilakan masuk</p>

      <div id="modal-details" class="bg-[var(--bg)] p-4 rounded-2xl border border-[var(--line)] space-y-2 text-left text-xs mb-5">
        <div class="flex justify-between items-center border-b border-[var(--line)] pb-2">
          <span class="text-[var(--sub)]">Nama Tamu</span>
          <strong id="res-guest-name" class="text-[var(--ink)] text-sm font-bold">-</strong>
        </div>
        <div class="flex justify-between items-center border-b border-[var(--line)] pb-2">
          <span class="text-[var(--sub)]">Kategori</span>
          <span id="res-category" class="tag">Umum</span>
        </div>
        <div class="flex justify-between items-center">
          <span class="text-[var(--sub)]">Jumlah Pax</span>
          <span id="res-pax" class="num text-[var(--brand)] font-bold text-sm">-</span>
        </div>
      </div>

      <button onclick="resumeScanner()" class="btn">
        Pindai Tiket Berikutnya <i data-lucide="arrow-right"></i>
      </button>
    </div>
  </div>

</div>

<!-- Toast Notification -->
<div class="toast" id="toast"></div>

<script>
const SUPABASE_URL = "https://awwraxmftlbekclwdrix.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_FirHDmsq1aDzQTPhQfyXjQ_x2f97MsJ";
const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let html5QrcodeScanner = null;
let isProcessing = false;
let allRegisteredGuests = [];

const icons = () => window.lucide && lucide.createIcons();

// Theme setup based on dashboard preference
function applyTheme() {
  const pref = localStorage.getItem('rr_theme') || 'auto';
  const mq = window.matchMedia('(prefers-color-scheme: dark)');
  const dark = pref === 'dark' || (pref === 'auto' && mq.matches);
  document.documentElement.dataset.dark = dark ? '1' : '0';
  document.getElementById('meta-theme').content = dark ? '#0b0f1a' : '#f4f5f8';
  icons();
}
applyTheme();

let toastTimer;
function toast(msg, ok = true) {
  const t = document.getElementById('toast');
  t.innerHTML = `<i data-lucide="${ok ? 'check-circle-2' : 'alert-circle'}"></i><span>${msg}</span>`;
  icons();
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2600);
}

function cleanTokenString(str) {
  if (!str) return '';
  return String(str).trim().toLowerCase().replace(/[\u200B-\u200D\uFEFF]/g, '');
}

async function startScanner() {
  if (!html5QrcodeScanner) {
    html5QrcodeScanner = new Html5Qrcode("reader");
  }
  const config = { fps: 10, qrbox: { width: 220, height: 220 } };

  try {
    await html5QrcodeScanner.start({ facingMode: "environment" }, config, onScanSuccess);
  } catch (err) {
    try {
      await html5QrcodeScanner.start({ facingMode: "user" }, config, onScanSuccess);
    } catch (errUser) {
      console.info("Kamera tidak aktif otomatis. Gunakan mode manual.");
    }
  }
  fetchRegisteredGuests();
  icons();
}

async function fetchRegisteredGuests() {
  const { data: rpcData, error: rpcError } = await supabaseClient.rpc('get_scanner_guests');
  if (!rpcError && rpcData && Array.isArray(rpcData)) {
    allRegisteredGuests = rpcData;
    updateGuestCountBadge();
    renderManualGuestList(allRegisteredGuests);
    return;
  }

  try {
    const [guestsRes, ticketsRes, rsvpsRes] = await Promise.all([
      supabaseClient.from('guests').select('id, group_name, category, max_pax, invitation_token').order('group_name', { ascending: true }),
      supabaseClient.from('tickets').select('guest_id, ticket_token, is_checked_in'),
      supabaseClient.from('rsvps').select('guest_id, status, pax_confirmed')
    ]);

    if (guestsRes.data) {
      const ticketMap = new Map();
      (ticketsRes.data || []).forEach(t => ticketMap.set(t.guest_id, t));
      const rsvpMap = new Map();
      (rsvpsRes.data || []).forEach(r => rsvpMap.set(r.guest_id, r));

      allRegisteredGuests = guestsRes.data.map(g => {
        const t = ticketMap.get(g.id);
        const r = rsvpMap.get(g.id);
        return {
          id: g.id,
          group_name: g.group_name,
          category: g.category || 'Umum',
          max_pax: g.max_pax || 2,
          invitation_token: g.invitation_token,
          ticket_token: t?.ticket_token || g.invitation_token,
          is_checked_in: !!t?.is_checked_in,
          pax_confirmed: r?.pax_confirmed || g.max_pax,
          rsvp_status: r?.status || 'pending'
        };
      });
      updateGuestCountBadge();
      renderManualGuestList(allRegisteredGuests);
    }
  } catch (err) {
    document.getElementById('manual-guest-list').innerHTML = '<div class="text-xs text-[var(--red-ink)] text-center py-4">Gagal memuat daftar tamu.</div>';
  }
}

function updateGuestCountBadge() {
  const total = allRegisteredGuests.length;
  const checked = allRegisteredGuests.filter(g => g.is_checked_in).length;
  const badge = document.getElementById('guest-count-badge');
  if (badge) badge.textContent = `${checked} dari ${total} tamu telah check-in`;
}

function renderManualGuestList(guests) {
  const container = document.getElementById('manual-guest-list');
  container.innerHTML = '';
  if (!guests || guests.length === 0) {
    container.innerHTML = '<div class="text-xs text-[var(--sub)] text-center py-4">Tamu tidak ditemukan.</div>';
    return;
  }

  guests.forEach((g, i) => {
    const activeToken = g.invitation_token || g.ticket_token;
    const [stClass, stText] = g.is_checked_in ? ['st-checked', 'Checked'] : ['st-hadir', 'Ready'];
    
    const div = document.createElement('div');
    div.className = "gl";
    div.onclick = () => selectManualGuest(activeToken);
    div.innerHTML = `
      <div class="av">${g.group_name.slice(0,2).toUpperCase()}</div>
      <div class="main">
        <div style="min-width:0;flex:1">
          <div class="n">${g.group_name}</div>
          <div style="font-size:12px;color:var(--sub);margin-top:2px;">${g.category} · <span class="num">${activeToken}</span></div>
        </div>
      </div>
      <span class="st ${stClass}">${stText}</span>
    `;
    container.appendChild(div);
  });
  icons();
}

function filterManualGuests() {
  const search = document.getElementById('manual-search-input').value.toLowerCase();
  const filtered = allRegisteredGuests.filter(g => 
    g.group_name.toLowerCase().includes(search) || 
    (g.invitation_token && g.invitation_token.toLowerCase().includes(search))
  );
  renderManualGuestList(filtered);
}

function openManualModal() {
  closeAllModals();
  fetchRegisteredGuests();
  document.getElementById('backdrop').classList.add('open');
  document.getElementById('manual-modal').classList.add('open');
  setTimeout(() => document.getElementById('manual-search-input')?.focus(), 250);
}

function closeManualModal() {
  document.getElementById('manual-modal').classList.remove('open');
  document.getElementById('backdrop').classList.remove('open');
}

function closeAllModals() {
  document.getElementById('manual-modal').classList.remove('open');
  document.getElementById('result-modal').classList.remove('open');
  document.getElementById('backdrop').classList.remove('open');
}

function selectManualGuest(token) {
  closeAllModals();
  if (token) processCheckIn(token);
}

function submitManualTokenInput() {
  const token = cleanTokenString(document.getElementById('manual-token-input').value);
  if (!token) return toast("Masukkan kode token terlebih dahulu.", false);
  closeAllModals();
  processCheckIn(token);
}

async function onScanSuccess(decodedText) {
  if (isProcessing) return;
  let rawText = String(decodedText).trim();
  if (!rawText || rawText === "undefined") return;

  isProcessing = true;
  if (navigator.vibrate) navigator.vibrate(100);

  let extractedToken = rawText;
  if (rawText.includes('?token=')) {
    extractedToken = rawText.split('?token=')[1].split('&')[0];
  } else if (rawText.includes('/')) {
    const parts = rawText.split('?')[0].split('/').filter(Boolean);
    extractedToken = parts[parts.length - 1];
  }

  extractedToken = cleanTokenString(extractedToken);
  await processCheckIn(extractedToken);
}

async function processCheckIn(ticketToken) {
  const tokenClean = cleanTokenString(ticketToken);
  const { data, error } = await supabaseClient.rpc('check_in_guest', { p_ticket_token: tokenClean });

  if (error) {
    return await fallbackDirectCheckIn(tokenClean);
  }

  if (!data.success) {
    showResultModal(false, "Peringatan Tiket", data.message, data.guest || null);
  } else {
    showResultModal(true, "Berhasil Check-in!", "Tamu terverifikasi resmi.", data.guest);
    fetchRegisteredGuests();
  }
}

async function fallbackDirectCheckIn(tokenClean) {
  try {
    const { data: guests } = await supabaseClient
      .from('guests')
      .select('id, group_name, category, max_pax, invitation_token')
      .ilike('invitation_token', tokenClean)
      .limit(1);

    if (!guests || guests.length === 0) {
      showResultModal(false, "Tiket Tidak Ditemukan", `Kode token "${tokenClean}" tidak terdaftar.`, null);
      return;
    }

    const g = guests[0];
    const { data: tickets } = await supabaseClient.from('tickets').select('*').eq('guest_id', g.id).limit(1);

    if (tickets && tickets.length > 0 && tickets[0].is_checked_in) {
      showResultModal(false, "Sudah Check-in", `Tamu "${g.group_name}" sudah diverifikasi sebelumnya.`, {
        group_name: g.group_name,
        category: g.category,
        max_pax: g.max_pax
      });
      return;
    }

    if (tickets && tickets.length > 0) {
      await supabaseClient.from('tickets').update({ is_checked_in: true, checked_in_at: new Date().toISOString() }).eq('id', tickets[0].id);
    } else {
      await supabaseClient.from('tickets').insert({ guest_id: g.id, ticket_token: g.invitation_token, is_checked_in: true, checked_in_at: new Date().toISOString() });
    }

    showResultModal(true, "Berhasil Check-in!", "Tamu terverifikasi.", {
      group_name: g.group_name,
      category: g.category,
      pax_confirmed: g.max_pax
    });
    fetchRegisteredGuests();
  } catch (err) {
    showResultModal(false, "Kesalahan Check-in", err.message || "Gagal memproses tiket.", null);
  }
}

function showResultModal(isSuccess, title, subtitle, guest) {
  closeAllModals();
  document.getElementById('modal-title').innerText = title;
  document.getElementById('modal-subtitle').innerText = subtitle;
  
  const iconBg = document.getElementById('modal-icon-bg');
  const icon = document.getElementById('modal-icon');

  if (isSuccess) {
    iconBg.className = "w-16 h-16 rounded-full mx-auto flex items-center justify-center text-3xl mb-3 bg-[var(--green-bg)] text-[var(--green-ink)]";
    icon.innerText = "✅";
  } else {
    iconBg.className = "w-16 h-16 rounded-full mx-auto flex items-center justify-center text-3xl mb-3 bg-[var(--red-bg)] text-[var(--red-ink)]";
    icon.innerText = "⚠️";
  }

  if (guest) {
    document.getElementById('modal-details').classList.remove('hidden');
    document.getElementById('res-guest-name').innerText = guest.group_name || "-";
    document.getElementById('res-category').innerText = guest.category || "Umum";
    document.getElementById('res-pax').innerText = `${guest.pax_confirmed || guest.max_pax || 1} Orang`;
  } else {
    document.getElementById('modal-details').classList.add('hidden');
  }

  document.getElementById('backdrop').classList.add('open');
  document.getElementById('result-modal').classList.add('open');
  icons();
}

function resumeScanner() {
  closeAllModals();
  setTimeout(() => { isProcessing = false; }, 500);
}

async function toggleTorch() {
  const btn = document.getElementById('btn-torch');
  try {
    const track = html5QrcodeScanner.getRunningTrack();
    if (track && track.getCapabilities().torch) {
      const torchState = track.getSettings().torch;
      await track.applyConstraints({ advanced: [{ torch: !torchState }] });
      btn.classList.toggle('active', !torchState);
    } else {
      toast("Senter tidak didukung kamera perangkat ini.", false);
    }
  } catch (e) {
    toast("Gagal mengaktifkan senter.", false);
  }
}

async function logout() {
  if (confirm("Keluar dari mode scanner?")) {
    await supabaseClient.auth.signOut();
    window.location.href = "/";
  }
}

window.addEventListener('DOMContentLoaded', startScanner);
</script>
