<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#f4f5f8" id="meta-theme" />
<title>Scanner Check-in - RayaRayu</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@500;600&family=Geist:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script>
<script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
<style>
:root{
  --bg:#f4f5f8; --card:#ffffff; --ink:#0d1424; --sub:#6b7385; --line:#e6e8ef;
  --brand:#0a3dc2; --soft:#e8edfb; --green:#12b76a; --green-bg:#dcf7ea; --green-ink:#0b8a57;
  --red:#e5484d; --red-bg:#fde4e5; --red-ink:#c62d33; --amber-bg:#fdf0d5; --amber-ink:#a86a00; --blue-bg:#dbe5ff;
  --shadow:0 1px 2px rgba(12,24,60,.05), 0 8px 24px rgba(12,24,60,.04);
  --ease:cubic-bezier(.32,.72,0,1);--spring:cubic-bezier(.34,1.56,.64,1);--glass:rgba(255,255,255,.7);--glass-line:rgba(255,255,255,.65)
}
:root[data-dark="1"]{
  --bg:#0b0f1a; --card:#151b2b; --ink:#f2f5ff; --sub:#97a0b5; --line:#242c40; --soft:#1d2a4f; --brand:#6d8bff;
  --green-bg:#0f3a2a; --green-ink:#4ade9a; --red-bg:#3d1d22; --red-ink:#ff8b90; --amber-bg:#3d300f; --amber-ink:#ffc865; --blue-bg:#1b2a57;
  --shadow:none; --glass:rgba(30,37,58,.62); --glass-line:rgba(255,255,255,.1)
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Geist',Inter,-apple-system,system-ui,sans-serif;-webkit-font-smoothing:antialiased;display:flex;justify-content:center}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer;text-align:left}
input{background:transparent}
input,select,textarea{font-size:16px!important}
.hidden{display:none!important}
#app{width:100%;max-width:480px;min-height:100vh;position:relative}
svg.lucide{width:1.15em;height:1.15em;stroke-width:1.8}
html.lock{overflow:hidden}

.topbar{display:flex;justify-content:space-between;align-items:center;padding:calc(env(safe-area-inset-top) + 22px) 20px 8px}
.topbar h1{margin:0;font-size:32px;color:var(--brand);font-weight:800;letter-spacing:-.03em}
.topbar p{margin:2px 0 0;color:var(--sub);font-size:14px;display:flex;align-items:center;gap:6px}
.live{width:8px;height:8px;border-radius:50%;background:var(--green);animation:pulse 1.8s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(18,183,106,.6)}70%{box-shadow:0 0 0 8px rgba(18,183,106,0)}100%{box-shadow:0 0 0 0 rgba(18,183,106,0)}}
.top-actions{display:flex;gap:8px}
.ib{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;color:var(--sub);flex-shrink:0;background:var(--card);transition:transform .35s var(--spring),color .25s,border-color .25s}
.ib:hover{border-color:var(--brand);color:var(--brand)}
.ib:active{transform:scale(.92)}
.ib svg{width:18px;height:18px}
.ib.spin svg{animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.page{padding:8px 16px calc(40px + env(safe-area-inset-bottom))}
.page>*+*{margin-top:12px}
.card{background:var(--card);border-radius:26px;padding:20px;box-shadow:var(--shadow)}
.ch{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.ch h3{margin:0;font-weight:700;font-size:19px}
.link{color:var(--sub);font-size:14px}

.brandcard{position:relative;overflow:hidden;isolation:isolate;color:#fff;background:radial-gradient(110% 80% at 100% 0%,#5b86ff 0%,transparent 58%),linear-gradient(155deg,#1a55e8 0%,#0a3dc2 55%,#072a8c 100%);box-shadow:0 22px 44px -16px rgba(10,61,194,.65),inset 0 1px 0 rgba(255,255,255,.25)}
.brandcard::before{content:"";position:absolute;z-index:-1;top:-90px;right:-70px;width:260px;height:260px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.26),transparent 66%);animation:drift 10s ease-in-out infinite alternate}
@keyframes drift{to{transform:translate(-50px,36px) scale(1.2)}}
.brandcard .ch h3{color:#fff}
.ringwrap{display:flex;align-items:center;gap:18px}
.ring{position:relative;width:140px;height:140px;flex-shrink:0}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:12;stroke-linecap:round}
.ring .bgc{stroke:rgba(255,255,255,.18)}
.ring .fgc{stroke:#fff;transition:stroke-dashoffset 1.3s var(--ease);filter:drop-shadow(0 0 7px rgba(255,255,255,.6))}
.ring .in{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .in small{font-size:13px;opacity:.85}
.ring .in b{font-family:'Geist Mono',monospace;font-size:36px;font-weight:600;line-height:1.1}
.brandcard .side{flex:1;display:flex;flex-direction:column;gap:8px}
.brandcard .sr{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-radius:14px;background:rgba(255,255,255,.1);font-size:14px}
.brandcard .sr b{font-family:'Geist Mono',monospace;font-size:20px;font-weight:600}

.card-switch{position:relative;display:flex;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px;box-shadow:var(--shadow)}
.card-switch button{position:relative;z-index:1;flex:1;text-align:center;padding:10px 0;border-radius:999px;font-size:14px;font-weight:600;color:var(--sub);transition:color .25s;display:flex;align-items:center;justify-content:center;gap:6px}
.card-switch button.active{color:#fff}
:root[data-dark="1"] .card-switch button.active{color:#0b0f1a}
.cs-thumb{position:absolute;top:4px;bottom:4px;left:0;border-radius:999px;background:var(--brand);box-shadow:0 6px 16px rgba(10,61,194,.35);transition:transform .5s var(--spring),width .5s var(--spring)}

.view{animation:viewIn .5s var(--ease) both}
@keyframes viewIn{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:none}}

.cam{position:relative;width:100%;aspect-ratio:1/1;border-radius:22px;overflow:hidden;background:#05070d;border:1px solid var(--line)}
#reader{position:absolute;inset:0;width:100%;height:100%;border:0!important}
#reader video{object-fit:cover!important;width:100%!important;height:100%!important}
#reader__scan_region{background:transparent!important}
#reader__dashboard{display:none!important}
.vf{position:absolute;inset:0;pointer-events:none;display:flex;align-items:center;justify-content:center;z-index:2}
.vf-box{position:relative;width:62%;aspect-ratio:1/1}
.vf-box i{position:absolute;width:30px;height:30px;border:4px solid #fff;filter:drop-shadow(0 0 6px rgba(0,0,0,.4))}
.vf-box i:nth-child(1){top:0;left:0;border-right:0;border-bottom:0;border-top-left-radius:16px}
.vf-box i:nth-child(2){top:0;right:0;border-left:0;border-bottom:0;border-top-right-radius:16px}
.vf-box i:nth-child(3){bottom:0;left:0;border-right:0;border-top:0;border-bottom-left-radius:16px}
.vf-box i:nth-child(4){bottom:0;right:0;border-left:0;border-top:0;border-bottom-right-radius:16px}
.laser{position:absolute;left:6%;right:6%;height:2px;background:linear-gradient(90deg,transparent,#5b86ff,transparent);box-shadow:0 0 14px #5b86ff;animation:laser 2.2s infinite ease-in-out}
@keyframes laser{0%{top:4%;opacity:.2}50%{opacity:1}100%{top:94%;opacity:.2}}
.cam-flash{position:absolute;inset:0;z-index:4;pointer-events:none;opacity:0}
.cam-flash.ok{background:rgba(18,183,106,.45);animation:flash .6s var(--ease)}
.cam-flash.bad{background:rgba(229,72,77,.45);animation:flash .6s var(--ease)}
@keyframes flash{0%{opacity:1}100%{opacity:0}}
.cam-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:14px}
.cam-bar p{margin:0;color:var(--sub);font-size:14px;flex:1}

.btn{width:100%;height:54px;border-radius:18px;background:var(--brand);color:#fff;font-weight:600;font-size:17px;display:flex;align-items:center;justify-content:center;gap:8px;transition:transform .35s var(--spring),opacity .2s}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.5}
.btn.line{background:var(--card);color:var(--brand);box-shadow:var(--shadow)}
:root[data-dark="1"] .btn{color:#0b0f1a}

.sbar{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:18px;height:54px;padding:0 16px;box-shadow:var(--shadow)}
.sbar>svg{color:var(--sub);width:20px;height:20px;flex-shrink:0}
.sbar input{flex:1;min-width:0;border:0;outline:none;color:var(--ink)}
.sbar input::placeholder{color:var(--sub)}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:12px -16px 0;padding:0 16px}
.chips::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;height:36px;padding:0 15px;border-radius:999px;background:var(--card);border:1px solid var(--line);color:var(--sub);font-size:14px;font-weight:600;white-space:nowrap;transition:all .25s}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff}
:root[data-dark="1"] .chip.on{color:#0b0f1a}

.listcard{background:var(--card);border-radius:26px;padding:4px 18px 8px;box-shadow:var(--shadow);max-height:420px;overflow-y:auto;scrollbar-width:none}
.listcard::-webkit-scrollbar{display:none}
.gl{display:flex;align-items:center;gap:12px;padding:14px 0;width:100%}
.gl+.gl{border-top:1px solid var(--line)}
.gl .txt{flex:1;min-width:0}
.gl .n{font-weight:600;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gl .s{color:var(--sub);font-size:13px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gl .s .code{font-family:'Geist Mono',monospace}
.av{width:46px;height:46px;min-width:46px;border-radius:50%;background:var(--soft);color:var(--brand);display:flex;align-items:center;justify-content:center;font-weight:600;font-size:15px;font-family:'Geist Mono',monospace}
.st{font-size:12px;padding:4px 12px;border-radius:999px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;flex-shrink:0}
.st::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.st-ready{background:var(--green-bg);color:var(--green-ink)}
.st-checked{background:var(--blue-bg);color:var(--brand)}
.st-absen{background:var(--red-bg);color:var(--red-ink)}
.st-warn{background:var(--amber-bg);color:var(--amber-ink)}
.empty{padding:32px 8px;text-align:center;color:var(--sub);font-size:15px}
.tokrow{display:flex;gap:10px}
.tokrow .sbar{flex:1;height:50px;box-shadow:none;border:1px solid var(--line)}
.tokrow input{font-family:'Geist Mono',monospace;text-transform:uppercase}
.tokrow .btn{width:auto;height:50px;padding:0 20px;font-size:15px;border-radius:16px}
.lbl{font-size:13px;color:var(--sub);margin-bottom:10px;font-weight:500}

.backdrop{position:fixed;inset:0;background:rgba(9,16,40,.45);z-index:50;opacity:0;pointer-events:none;transition:opacity .35s var(--ease)}
.backdrop.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:50%;bottom:0;width:100%;max-width:480px;z-index:51;background:var(--bg);border-radius:32px 32px 0 0;padding:10px 16px calc(18px + env(safe-area-inset-bottom));max-height:88vh;overflow-y:auto;transform:translate(-50%,105%);transition:transform .6s var(--ease);box-shadow:0 -20px 60px rgba(9,16,40,.25);overscroll-behavior:contain}
.sheet.open{transform:translate(-50%,0)}
.grab{width:40px;height:5px;border-radius:99px;background:var(--line);margin:0 auto 14px}
.res{text-align:center;padding:6px 4px 4px}
.res-ico{width:72px;height:72px;border-radius:50%;margin:0 auto 14px;display:grid;place-items:center;animation:pop .6s var(--spring)}
.res-ico svg{width:34px;height:34px;stroke-width:2.2}
.res-ico.ok{background:var(--green-bg);color:var(--green-ink)}
.res-ico.bad{background:var(--red-bg);color:var(--red-ink)}
.res-ico.warn{background:var(--amber-bg);color:var(--amber-ink)}
.res-ico.info{background:var(--soft);color:var(--brand)}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:none;opacity:1}}
.res h3{margin:0;font-size:24px;font-weight:800;letter-spacing:-.02em}
.res p{margin:6px 0 0;color:var(--sub);font-size:15px;white-space:pre-line;word-break:break-word}
.detail{margin-top:16px;background:var(--card);border-radius:22px;padding:4px 18px;box-shadow:var(--shadow)}
.detail .row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 0;font-size:15px}
.detail .row+.row{border-top:1px solid var(--line)}
.detail .row span{color:var(--sub)}
.detail .row b{font-weight:600;text-align:right}
.detail .row b.mono{font-family:'Geist Mono',monospace}
.sheet-actions{display:flex;flex-direction:column;gap:10px;margin-top:16px}
.autobar{height:4px;border-radius:99px;background:var(--line);margin-top:14px;overflow:hidden}
.autobar i{display:block;height:100%;width:100%;background:var(--green);transform-origin:left;animation:shrink 2.6s linear forwards}
@keyframes shrink{to{transform:scaleX(0)}}

.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top));transform:translate(-50%,-160%);z-index:80;background:var(--glass);color:var(--ink);padding:12px 18px;border-radius:999px;font-size:14px;font-weight:500;display:flex;gap:8px;align-items:center;transition:transform .6s var(--spring);max-width:92%;box-shadow:0 10px 30px rgba(0,0,0,.2);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border:1px solid var(--glass-line)}
.toast svg{width:16px;height:16px}
.toast.show{transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*,*::before{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app">
  <header class="topbar">
    <div>
      <h1>Scanner</h1>
      <p><span class="live"></span>Mode Operator Door</p>
    </div>
    <div class="top-actions">
      <button class="ib" onclick="refreshGuests()" id="btn-refresh" aria-label="Muat ulang data"><i data-lucide="refresh-cw"></i></button>
      <button class="ib" onclick="toggleTheme()" id="btn-theme" aria-label="Ganti tema"><i data-lucide="moon"></i></button>
      <button class="ib" onclick="logout()" aria-label="Keluar"><i data-lucide="log-out"></i></button>
    </div>
  </header>

  <div class="page">
    <!-- Scan -->
    <div id="view-scan" class="view">
      <div class="card" style="padding:14px">
        <div class="cam">
          <div id="reader"></div>
          <div class="vf"><div class="vf-box"><i></i><i></i><i></i><i></i><div class="laser"></div></div></div>
          <div class="cam-flash" id="cam-flash"></div>
        </div>
        <div class="cam-bar">
          <p id="cam-hint">Arahkan kamera ke QR Code tiket tamu</p>
          <button class="ib" onclick="switchCamera()" aria-label="Ganti kamera"><i data-lucide="switch-camera"></i></button>
        </div>
      </div>
    </div>

    <!-- Manual View (jika mode manual aktif) -->
    <div id="view-manual" class="hidden view">
      <div class="sbar"><i data-lucide="search"></i><input type="search" id="manual-search-input" placeholder="Ketik nama tamu atau kode…" oninput="filterManualGuests()" /></div>
      <div class="chips" id="manual-chips">
        <button class="chip on" data-f="all">Semua</button>
        <button class="chip" data-f="wait">Belum masuk</button>
        <button class="chip" data-f="done">Sudah masuk</button>
      </div>
      <div class="listcard" id="manual-guest-list" style="margin-top:12px"><div class="empty">Memuat daftar tamu...</div></div>
      <div class="card" style="margin-top:12px">
        <div class="lbl">Atau masukkan kode token tiket</div>
        <div class="tokrow">
          <div class="sbar"><i data-lucide="ticket"></i><input type="text" id="manual-token-input" placeholder="Contoh: 115b0522" autocomplete="off" autocapitalize="none" spellcheck="false" onkeydown="if(event.key==='Enter')submitManualTokenInput()" /></div>
          <button class="btn" onclick="submitManualTokenInput()">Proses</button>
        </div>
      </div>
    </div>

    <!-- Mode (Scan QR / Cari Manual) -->
    <div class="card-switch" id="mode-switch">
      <button class="active" onclick="switchMode('scan')"><i data-lucide="scan-line"></i>Scan QR</button>
      <button onclick="switchMode('manual')"><i data-lucide="search"></i>Cari Manual</button>
    </div>

    <!-- Statistik (Card Biru) -->
    <div class="card brandcard">
      <div class="ch" style="margin-bottom:12px"><h3>Check-in</h3></div>
      <div class="ringwrap">
        <div class="ring">
          <svg viewBox="0 0 100 100"><circle class="bgc" cx="50" cy="50" r="44"/><circle class="fgc" id="ring-fg" cx="50" cy="50" r="44" stroke-dasharray="276.46" stroke-dashoffset="276.46"/></svg>
          <div class="in"><small>Masuk</small><b id="ring-num">0</b></div>
        </div>
        <div class="side">
          <div class="sr"><span>Total grup</span><b id="st-total">0</b></div>
          <div class="sr"><span>Belum masuk</span><b id="st-wait">0</b></div>
          <div class="sr"><span>Orang masuk</span><b id="st-pax">0</b></div>
        </div>
      </div>
    </div>

    <!-- Riwayat -->
    <div class="card">
      <div class="ch"><h3>Riwayat Scan</h3><span class="link" id="hist-count">0 scan</span></div>
      <div id="hist-list"><div class="empty">Belum ada scan di sesi ini.</div></div>
    </div>
  </div>
</div>

<div class="backdrop" id="backdrop" onclick="onBackdrop()"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
<div class="toast" id="toast"></div>

<script>
  const SUPABASE_URL = "https://awwraxmftlbekclwdrix.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_FirHDmsq1aDzQTPhQfyXjQ_x2f97MsJ";
  const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  let html5QrcodeScanner = null;
  let isProcessing = false;
  let allRegisteredGuests = [];

  const $ = id => document.getElementById(id);
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const icons = () => window.lucide && lucide.createIcons();
  const initials = s => String(s || '?').trim().split(/\s+/).slice(0, 2).map(w => w[0]).join('').toUpperCase();
  const COLORS = ['#0a3dc2','#12b76a','#f5a524','#e5484d','#7c5cff','#0ea5e9','#ec4899'];
  let currentFacing = "environment";
  let mode = 'scan';
  let manualFilter = 'all';
  let sessionHistory = [];
  let autoTimer = null;
  let lastToken = '', lastTokenAt = 0;

  const mq = matchMedia('(prefers-color-scheme: dark)');
  function applyTheme() {
    const pref = localStorage.getItem('rr_theme') || 'auto';
    const dark = pref === 'dark' || (pref === 'auto' && mq.matches);
    document.documentElement.dataset.dark = dark ? '1' : '0';
    $('meta-theme').content = dark ? '#0b0f1a' : '#f4f5f8';
    $('btn-theme').innerHTML = `<i data-lucide="${dark ? 'sun' : 'moon'}"></i>`;
    icons();
  }
  mq.addEventListener('change', applyTheme);
  function toggleTheme() {
    const dark = document.documentElement.dataset.dark === '1';
    localStorage.setItem('rr_theme', dark ? 'light' : 'dark');
    applyTheme();
  }

  let toastTimer;
  function toast(msg, ok = true) {
    const t = $('toast');
    t.innerHTML = `<i data-lucide="${ok ? 'check' : 'alert-circle'}"></i><span>${esc(msg)}</span>`;
    icons(); t.classList.add('show');
    clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2400);
  }
  function openSheet(html) {
    $('sheet').innerHTML = '<div class="grab"></div>' + html;
    icons();
    $('backdrop').classList.add('open'); $('sheet').classList.add('open');
    document.documentElement.classList.add('lock');
  }
  function closeSheet() {
    clearTimeout(autoTimer);
    $('backdrop').classList.remove('open'); $('sheet').classList.remove('open');
    document.documentElement.classList.remove('lock');
  }
  function onBackdrop() { closeSheet(); resumeScanner(); }

  function beep(ok) {
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type = 'sine'; o.frequency.value = ok ? 880 : 220;
      const d = ok ? .18 : .35;
      g.gain.setValueAtTime(.15, ctx.currentTime);
      g.gain.exponentialRampToValueAtTime(.001, ctx.currentTime + d);
      o.connect(g); g.connect(ctx.destination); o.start(); o.stop(ctx.currentTime + d);
    } catch (e) {}
  }
  function feedback(ok) {
    const f = $('cam-flash'); f.className = 'cam-flash'; void f.offsetWidth; f.classList.add(ok ? 'ok' : 'bad');
    beep(ok);
    if (navigator.vibrate) navigator.vibrate(ok ? 80 : [120, 60, 120]);
  }

  function placeThumb() {
    const sw = $('mode-switch'), a = sw.querySelector('button.active'); if (!a || !a.offsetWidth) return;
    let t = sw.querySelector('.cs-thumb');
    if (!t) { t = document.createElement('i'); t.className = 'cs-thumb'; t.style.transition = 'none'; sw.append(t); void t.offsetWidth; t.style.transition = ''; }
    t.style.width = a.offsetWidth + 'px'; t.style.transform = `translateX(${a.offsetLeft}px)`;
  }
  window.addEventListener('resize', placeThumb);

  function switchMode(m) {
    mode = m;
    const bs = document.querySelectorAll('#mode-switch button');
    bs[0].classList.toggle('active', m === 'scan'); bs[1].classList.toggle('active', m === 'manual');
    $('view-scan').classList.toggle('hidden', m !== 'scan');
    $('view-manual').classList.toggle('hidden', m !== 'manual');
    placeThumb();
    if (m === 'scan') { restartCamera(); }
    else { stopCamera(); filterManualGuests(); }
  }

  function scannerConfig() { return { fps: 10, qrbox: { width: 220, height: 220 } }; }

  async function startScanner() {
    html5QrcodeScanner = new Html5Qrcode("reader");
    const config = scannerConfig();
    try {
      await html5QrcodeScanner.start({ facingMode: "environment" }, config, onScanSuccess);
      currentFacing = "environment";
    } catch (err) {
      try {
        await html5QrcodeScanner.start({ facingMode: "user" }, config, onScanSuccess);
        currentFacing = "user";
      } catch (errUser) {
        $('cam-hint').textContent = 'Kamera tidak aktif. Gunakan Cari Manual atau cek izin kamera.';
      }
    }
    fetchRegisteredGuests();
  }

  async function stopCamera() {
    try {
      if (html5QrcodeScanner && html5QrcodeScanner.isScanning) await html5QrcodeScanner.stop();
    } catch (e) {}
  }
  async function restartCamera() {
    await stopCamera();
    try {
      if (!html5QrcodeScanner) html5QrcodeScanner = new Html5Qrcode("reader");
      await html5QrcodeScanner.start({ facingMode: currentFacing }, scannerConfig(), onScanSuccess);
      $('cam-hint').textContent = 'Arahkan kamera ke QR Code tiket tamu';
    } catch (err) {
      try {
        const other = currentFacing === 'environment' ? 'user' : 'environment';
        await html5QrcodeScanner.start({ facingMode: other }, scannerConfig(), onScanSuccess);
        currentFacing = other;
      } catch (e2) {
        $('cam-hint').textContent = 'Kamera tidak aktif. Gunakan Cari Manual atau cek izin kamera.';
      }
    }
  }
  async function switchCamera() {
    currentFacing = currentFacing === 'environment' ? 'user' : 'environment';
    await restartCamera();
  }
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) stopCamera();
    else if (mode === 'scan') restartCamera();
  });

  function cleanTokenString(str) {
    if (!str) return '';
    return String(str).trim().toLowerCase().replace(/[\u200B-\u200D\uFEFF]/g, '').replace(/[\u2010-\u2015\u2212]/g, '-');
  }

  async function fetchRegisteredGuests() {
    const { data: rpcData, error: rpcError } = await supabaseClient.rpc('get_scanner_guests');
    if (!rpcError && rpcData && Array.isArray(rpcData)) {
      allRegisteredGuests = rpcData;
      updateGuestCountBadge();
      filterManualGuests();
      return;
    }

    try {
      const [guestsRes, ticketsRes, rsvpsRes] = await Promise.all([
        supabaseClient.from('guests').select('id, group_name, category, max_pax, invitation_token').order('group_name', { ascending: true }),
        supabaseClient.from('tickets').select('guest_id, ticket_token, is_checked_in'),
        supabaseClient.from('rsvps').select('guest_id, status, pax_confirmed')
      ]);

      if (guestsRes.data) {
        const ticketMap = new Map();
        (ticketsRes.data || []).forEach(t => ticketMap.set(t.guest_id, t));
        const rsvpMap = new Map();
        (rsvpsRes.data || []).forEach(r => rsvpMap.set(r.guest_id, r));

        allRegisteredGuests = guestsRes.data.map(g => {
          const t = ticketMap.get(g.id);
          const r = rsvpMap.get(g.id);
          return {
            id: g.id,
            group_name: g.group_name,
            category: g.category || 'Umum',
            max_pax: g.max_pax || 2,
            invitation_token: g.invitation_token,
            ticket_token: t?.ticket_token || g.invitation_token,
            is_checked_in: !!t?.is_checked_in,
            pax_confirmed: r?.pax_confirmed || g.max_pax,
            rsvp_status: r?.status || 'pending'
          };
        });

        updateGuestCountBadge();
        filterManualGuests();
      }
    } catch (err) {
      $('manual-guest-list').innerHTML = '<div class="empty">Gagal memuat data tamu dari database.</div>';
    }
  }

  async function refreshGuests() {
    const b = $('btn-refresh'); b.classList.add('spin');
    await fetchRegisteredGuests();
    b.classList.remove('spin'); toast('Data diperbarui');
  }

  function updateGuestCountBadge() {
    const total = allRegisteredGuests.length;
    const done = allRegisteredGuests.filter(g => g.is_checked_in);
    const pax = done.reduce((s, g) => s + (g.pax_confirmed || g.max_pax || 1), 0);
    $('ring-num').textContent = done.length;
    $('st-total').textContent = total;
    $('st-wait').textContent = total - done.length;
    $('st-pax').textContent = pax;
    $('ring-fg').style.strokeDashoffset = 276.46 * (1 - (total ? done.length / total : 0));
  }

  function renderManualGuestList(guests) {
    const container = $('manual-guest-list');
    if (!guests || guests.length === 0) {
      container.innerHTML = '<div class="empty">Tamu tidak ditemukan.</div>';
      return;
    }
    container.innerHTML = guests.slice(0, 80).map((g, i) => {
      const activeToken = g.invitation_token || g.ticket_token;
      const c = COLORS[i % COLORS.length];
      return `<button class="gl" data-token="${esc(activeToken)}">
        <div class="av" style="background:${c}22;color:${c}">${esc(initials(g.group_name))}</div>
        <div class="txt"><div class="n">${esc(g.group_name)}</div><div class="s">${esc(g.category || 'Umum')} · <span class="code">${esc(activeToken)}</span></div></div>
        <span class="st ${g.is_checked_in ? 'st-checked' : 'st-ready'}">${g.is_checked_in ? 'Checked' : 'Ready'}</span>
      </button>`;
    }).join('') + (guests.length > 80 ? `<div class="empty" style="padding:14px">+${guests.length - 80} lainnya, persempit pencarian.</div>` : '');
  }

  function filterManualGuests() {
    const search = $('manual-search-input').value.toLowerCase();
    document.querySelectorAll('#manual-chips .chip').forEach(c => c.classList.toggle('on', c.dataset.f === manualFilter));
    let filtered = allRegisteredGuests.filter(g =>
      g.group_name.toLowerCase().includes(search) ||
      (g.invitation_token && g.invitation_token.toLowerCase().includes(search)) ||
      (g.ticket_token && g.ticket_token.toLowerCase().includes(search))
    );
    if (manualFilter === 'wait') filtered = filtered.filter(g => !g.is_checked_in);
    if (manualFilter === 'done') filtered = filtered.filter(g => g.is_checked_in);
    renderManualGuestList(filtered);
  }
  $('manual-chips').addEventListener('click', e => {
    const b = e.target.closest('.chip'); if (!b) return;
    manualFilter = b.dataset.f; filterManualGuests();
  });
  $('manual-guest-list').addEventListener('click', e => {
    const b = e.target.closest('[data-token]'); if (b) selectManualGuest(b.dataset.token);
  });

  function selectManualGuest(token) {
    if (!token) return;
    const g = allRegisteredGuests.find(x => (x.invitation_token || x.ticket_token) === token);
    isProcessing = true;
    if (!g) { processCheckIn(token); return; }
    if (g.is_checked_in) {
      openSheet(`
        <div class="res"><div class="res-ico warn"><i data-lucide="user-check"></i></div><h3>Sudah Check-in</h3><p>${esc(g.group_name)} sudah diverifikasi sebelumnya.</p></div>
        <div class="sheet-actions"><button class="btn line" onclick="closeSheet();resumeScanner()">Tutup</button></div>`);
      return;
    }
    openSheet(`
      <div class="res"><div class="res-ico info"><i data-lucide="user-round"></i></div><h3>Check-in tamu ini?</h3><p>Pastikan tamu sudah ada di depan Anda.</p></div>
      <div class="detail">
        <div class="row"><span>Nama</span><b>${esc(g.group_name)}</b></div>
        <div class="row"><span>Kategori</span><b>${esc(g.category || 'Umum')}</b></div>
        <div class="row"><span>Jumlah</span><b class="mono">${g.pax_confirmed || g.max_pax || 1} orang</b></div>
      </div>
      <div class="sheet-actions">
        <button class="btn" id="do-ci">Check-in sekarang</button>
        <button class="btn line" onclick="closeSheet();resumeScanner()">Batal</button>
      </div>`);
    $('do-ci').onclick = () => { $('do-ci').disabled = true; processCheckIn(token, 'manual'); };
  }

  function submitManualTokenInput() {
    const token = cleanTokenString($('manual-token-input').value);
    if (!token) return toast("Masukkan kode token terlebih dahulu.", false);
    $('manual-token-input').value = '';
    isProcessing = true;
    processCheckIn(token, 'manual');
  }

  async function onScanSuccess(decodedText) {
    if (isProcessing) return;

    let rawText = String(decodedText).trim();
    if (!rawText || rawText === "undefined") return;

    let extractedToken = rawText;
    if (rawText.includes('?token=')) {
      extractedToken = rawText.split('?token=')[1].split('&')[0];
    } else if (rawText.includes('/')) {
      const parts = rawText.split('?')[0].split('/').filter(Boolean);
      extractedToken = parts[parts.length - 1];
    }

    extractedToken = cleanTokenString(extractedToken);

    const now = Date.now();
    if (extractedToken === lastToken && now - lastTokenAt < 4000) return;
    lastToken = extractedToken; lastTokenAt = now;

    isProcessing = true;
    if (navigator.vibrate) navigator.vibrate(100);
    await processCheckIn(extractedToken, 'scan');
  }

  async function processCheckIn(ticketToken, source = 'scan') {
    const tokenClean = cleanTokenString(ticketToken);

    const { data, error } = await supabaseClient.rpc('check_in_guest', { p_ticket_token: tokenClean });

    if (error) {
      return await fallbackDirectCheckIn(tokenClean, source);
    }

    if (!data.success) {
      showModal(false, "Peringatan Tiket", `${data.message}\n(Kode terbaca: "${tokenClean}")`, data.guest || null, source);
    } else {
      showModal(true, "Berhasil Check-in!", "Tamu terverifikasi resmi.", data.guest, source);
      fetchRegisteredGuests();
    }
  }

  async function fallbackDirectCheckIn(tokenClean, source = 'scan') {
    try {
      const { data: guests } = await supabaseClient
        .from('guests')
        .select('id, group_name, category, max_pax, invitation_token')
        .ilike('invitation_token', tokenClean)
        .limit(1);

      if (!guests || guests.length === 0) {
        showModal(false, "Tiket Tidak Ditemukan", `Kode token "${tokenClean}" tidak terdaftar di daftar undangan.`, null, source);
        return;
      }

      const g = guests[0];
      const { data: tickets } = await supabaseClient
        .from('tickets')
        .select('*')
        .eq('guest_id', g.id)
        .limit(1);

      if (tickets && tickets.length > 0 && tickets[0].is_checked_in) {
        showModal(false, "Sudah Pernah Check-in", `Tamu "${g.group_name}" sudah diverifikasi sebelumnya.`, {
          group_name: g.group_name,
          category: g.category,
          max_pax: g.max_pax
        }, source);
        return;
      }

      if (tickets && tickets.length > 0) {
        await supabaseClient.from('tickets').update({ is_checked_in: true, checked_in_at: new Date().toISOString() }).eq('id', tickets[0].id);
      } else {
        await supabaseClient.from('tickets').insert({ guest_id: g.id, ticket_token: g.invitation_token, is_checked_in: true, checked_in_at: new Date().toISOString() });
      }

      showModal(true, "Berhasil Check-in!", "Tamu terverifikasi resmi (Direct Mode).", {
        group_name: g.group_name,
        category: g.category,
        pax_confirmed: g.max_pax
      }, source);
      fetchRegisteredGuests();
    } catch (err) {
      showModal(false, "Kesalahan Check-in", err.message || "Gagal memproses tiket.", null, source);
    }
  }

  function showModal(isSuccess, title, subtitle, guest, source = 'scan') {
    const dup = !isSuccess && /sudah/i.test(title + ' ' + subtitle);
    const cls = isSuccess ? 'ok' : (dup ? 'warn' : 'bad');
    const ico = isSuccess ? 'check' : (dup ? 'user-check' : 'x');
    feedback(isSuccess);

    const pax = guest ? (guest.pax_confirmed || guest.max_pax || 1) : null;
    addHistory({ ok: isSuccess, dup, name: guest?.group_name || '(tidak dikenal)', pax });

    const detail = guest ? `
      <div class="detail">
        <div class="row"><span>Nama Tamu</span><b>${esc(guest.group_name || '-')}</b></div>
        <div class="row"><span>Kategori</span><b>${esc(guest.category || 'Umum')}</b></div>
        <div class="row"><span>Jumlah Pax</span><b class="mono">${pax} Orang</b></div>
      </div>` : '';
    const auto = isSuccess && source === 'scan';
    openSheet(`
      <div class="res"><div class="res-ico ${cls}"><i data-lucide="${ico}"></i></div><h3>${esc(title)}</h3><p>${esc(subtitle)}</p></div>
      ${detail}
      ${auto ? '<div class="autobar"><i></i></div>' : ''}
      <div class="sheet-actions"><button class="btn" onclick="resumeScanner()">${source === 'scan' ? 'Pindai Tiket Berikutnya' : 'Selesai'}</button></div>`);
    if (auto) autoTimer = setTimeout(resumeScanner, 2600);
  }

  function resumeScanner() {
    closeSheet();
    setTimeout(() => {
      isProcessing = false;
    }, 500);
  }

  function addHistory(h) {
    h.time = new Date();
    sessionHistory.unshift(h); sessionHistory = sessionHistory.slice(0, 15);
    $('hist-count').textContent = sessionHistory.length + ' scan';
    $('hist-list').innerHTML = sessionHistory.map(x => {
      const k = x.ok ? ['st-ready', 'Berhasil'] : x.dup ? ['st-warn', 'Duplikat'] : ['st-absen', 'Gagal'];
      const tm = x.time.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
      return `<div class="gl">
        <div class="av">${esc(initials(x.name))}</div>
        <div class="txt"><div class="n">${esc(x.name)}</div><div class="s">${x.pax ? x.pax + ' orang · ' : ''}<span class="code">${tm}</span></div></div>
        <span class="st ${k[0]}">${k[1]}</span></div>`;
    }).join('');
  }

  function logout() {
    openSheet(`
      <div class="res"><div class="res-ico warn"><i data-lucide="log-out"></i></div><h3>Keluar dari mode scanner?</h3></div>
      <div class="sheet-actions">
        <button class="btn" style="background:var(--red);color:#fff" onclick="doLogout()">Keluar</button>
        <button class="btn line" onclick="closeSheet()">Batal</button>
      </div>`);
  }
  async function doLogout() {
    await supabaseClient.auth.signOut();
    window.location.href = "/";
  }

  window.addEventListener('DOMContentLoaded', () => {
    applyTheme(); icons(); placeThumb();
    startScanner();
  });
</script>
</body>
</html>
